#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = ~/.config/hypr/scripts/reset-portals.sh
exec-once = waybar
exec-once = mako
exec-once = nm-applet & blueman-applet
exec-once = fcitx5 -d
exec-once = wl-paste --watch cliphist -max-items 25 store
# exec-once = swaybg --image /home/jade/Pictures/1311862.jpeg --mode fill
exec-once = hyprpaper
# exec-once = /home/jade/.config/hypr/scripts/swayidle.sh
exec-once = hypridle

